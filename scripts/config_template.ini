scm_datasets = ${CONFIG_DATASETS}
scm_datasets_labels = ${CONFIG_LABELS}
plot_dir = ${PLOT_DIR}/
obs_file = ${OBS_FILE}
obs_compare = ${OBS_COMPARE}
plot_ind_datasets = True
time_series_resample = False

[time_slices]
  [[active]]
    start = ${START_TIME}
    end = ${END_TIME}

[time_snapshots]

[plots]
  [[profiles_mean]]
    vars = T, qv
    vars_labels = 'Temperature (K)', 'specific humidity ($g$ $kg^{-1}$)'
    vert_axis = pres_l
    vert_axis_label = 'pressure (Pa)'
    y_inverted = True
    y_log = False
    y_min_option = min
    y_max_option = max
    conversion_factor = 1.0, 1000.0

  [[profiles_mean_multi]]

  [[profiles_instant]]

  [[time_series]]
    vars = shf, lhf
    vars_labels = 'sensible heat flux', 'latent heat flux'

  [[time_series_multi]]

  [[contours]]
    vars =  T, qv
    vars_labels = 'Temperature','Water Vapor'
    vert_axis = pres_l
    vert_axis_label = 'p (Pa)'
    y_inverted = True
    y_log = False
    y_min_option = val
    y_min = 10000.0
    y_max_option = val
    y_max = 100000.0
    x_ticks_num = 10
    y_ticks_num = 10
