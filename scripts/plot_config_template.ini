scm_datasets = ${CONFIG_DATASETS}
scm_datasets_labels = ${CONFIG_LABELS}
plot_dir = ${PLOT_DIR}/
obs_file = ${OBS_FILE}
obs_compare = ${OBS_COMPARE}
plot_ind_datasets = True
time_series_resample = False

[time_slices]
  [[active]]
    start = ${START_TIME}
    end = ${END_TIME}

[time_snapshots]

[plots]
  [[profiles_mean]]
    vars = T, qv, qc, ql, qi, dT_dt_pbl, dT_dt_conv, dT_dt_micro, dT_dt_lwrad, dT_dt_swrad, rad_cloud_fraction
    vars_labels = 'Temperature (K)', 'Specific Humidity ($g$ $kg^{-1}$)', 'Total Cloud Water (res + sgs) ($g$ $kg^{-1}$)', 'Liquid Cloud Water (res) ($g$ $kg^{-1}$)', 'Ice Cloud Water (res) ($g$ $kg^{-1}$)', 'PBL Tendency (K/day)', 'Conv. Tendency (K/day)', 'Microphysics Tendency (K/day)', 'LW Tendency (K/day)', 'SW Tendency (K/day)', 'Cloud Fraction'
    vert_axis = pres_l
    vert_axis_label = 'pressure (Pa)'
    y_inverted = True
    y_log = False
    y_min_option = min
    y_max_option = max
    conversion_factor = 1.0, 1000.0, 1000.0, 1000.0, 1000.0, 86400.0, 86400.0, 86400.0, 86400.0, 86400.0, 1.0

  [[profiles_mean_multi]]
    [[[T_forcing]]]
      vars = T_force_tend, dT_dt_pbl, dT_dt_conv, dT_dt_micro, dT_dt_lwrad, dT_dt_swrad
      vars_labels = 'Force', 'PBL', 'Conv', 'MP', 'LW', 'SW'
      x_label = 'K/day'
      conversion_factor = 86400.0
    [[[q_forcing]]]
      vars = qv_force_tend, dq_dt_pbl, dq_dt_conv, dq_dt_micro
      vars_labels = 'Force', 'PBL', 'Conv', 'MP'
      x_label = '$g$ $kg^{-1}$ $day^{-1}$'
      conversion_factor = 86400.0
    [[[conv_tendencies]]]
      vars = dT_dt_deepconv, dT_dt_shalconv
      vars_labels = 'Deep', 'Shallow'
      x_label = 'K/day'
      conversion_factor = 86400.0

  [[profiles_instant]]

  [[time_series]]
    vars = shf, lhf, pres_s, tprcp_rate_accum, pwat, sfc_dwn_lw, sfc_dwn_sw
    vars_labels = 'Sensible Heat Flux ($W$ $m^{-2}$)', 'Latent Heat Flux ($W$ $m^{-2}$)', 'Surface Pressure (Pa)', 'Surface Rainfall Rate ($mm$ $hr{-1}$)', 'precipitable water ($cm$)', 'sfc downwelling LW ($W$ $m^{-2}$)', 'sfc downwelling SW ($W$ $m^{-2}$)'
    conversion_factor = 1.0, 1.0, 1.0, 3600000.0, 0.1, 1.0, 1.0

  [[time_series_multi]]

  [[contours]]
    vars =  T, qv, u, v, qc, ql, qi
    vars_labels = 'Temperature (K)', 'Specific Humidity ($g$ $kg^{-1}$)', 'U ($m$ $s^{-1}$)', 'V ($m$ $s^{-1}$)', 'Total Cloud Water (res + sgs) ($g$ $kg^{-1}$)', 'Liquid Cloud Water (res) ($g$ $kg^{-1}$)', 'Ice Cloud Water (res) ($g$ $kg^{-1}$)'
    vert_axis = pres_l
    vert_axis_label = 'p (Pa)'
    y_inverted = True
    y_log = False
    y_min_option = val
    y_min = 10000.0
    y_max_option = val
    y_max = 100000.0
    x_ticks_num = 10
    y_ticks_num = 10
    conversion_factor = 1.0, 1000.0, 1.0, 1.0, 1000.0, 1000.0, 1000.0
