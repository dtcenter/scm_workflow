<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCM Case Comparison Viewer</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f7f7f7;
        display: flex;
        height: 100vh;
    }

    /* Sidebar styling */
    #sidebar {
        width: 270px;
        background-color: #2f3e46;
        color: #ffffff;
        padding: 20px;
        box-shadow: 2px 0 8px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        overflow-y: auto;
    }

    #sidebar h2 {
        margin-top: 0;
        font-size: 20px;
        color: #a8dadc;
    }

    #sidebar label {
        margin-top: 15px;
        font-weight: bold;
        font-size: 14px;
    }

    #sidebar select {
        width: 100%;
        font-size: 16px;
        padding: 5px;
        margin-top: 8px;
        border-radius: 4px;
        border: none;
    }

    /* Hide sections until case is selected */
    .config-section {
        display: none;
        margin-top: 10px;
        width: 100%;
    }

    /* Main content area */
    #main {
        flex-grow: 1;
        padding: 30px;
        text-align: center;
        overflow-y: auto;
    }

    #main h1 {
        color: #333;
    }

    img {
        margin-top: 30px;
        max-width: 90%;
        height: auto;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);
    }
</style>
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h2>Case Selection</h2>

        <!-- Case selection dropdown -->
        <label for="caseSelect">Case</label>
        <select id="caseSelect" onchange="selectCase()">
            <option value="">-- Select a case --</option>
        </select>

        <!-- Config selection dropdowns -->
        <div id="configSection" class="config-section">
            <h2>Config Selection</h2>

	    <label for="suiteSelect">Suite</label>
            <select id="suiteSelect" onchange="clearFigure()">
                <option value="">-- Select Suite --</option>
            </select>

	    <label for="areaSelect">Column Area</label>
            <select id="areaSelect" onchange="clearFigure()">
                <option value="">-- Select Area --</option>
            </select>

	    <label for="dtSelect">Time Step</label>
            <select id="dtSelect" onchange="clearFigure()">
                <option value="">-- Select Time Step --</option>
            </select>

	    <label for="dtiSelect">Physics Time Step</label>
            <select id="dtiSelect" onchange="clearFigure()">
                <option value="">-- Select Physics Time Step --</option>
            </select>

	    <!-- Figure selection dropdowns -->
            <div id="figureSection" class="figure-section">
                <h2>Figure Selection</h2>

                <!-- Mean profiles dropdown -->
                <label for="meanSelect">Mean Profiles</label>
                <select id="meanSelect" onchange="updateFigure('mean')">
                    <option value="">-- Select a mean profile --</option>
                </select>

                <!-- Bias profiles dropdown -->
                <label for="biasSelect">Bias Profiles</label>
                <select id="biasSelect" onchange="updateFigure('bias')">
                    <option value="">-- Select a bias profile --</option>
                </select>

                <!-- Timeseries dropdown -->
                <label for="tsSelect">Timeseries</label>
	        <select id="tsSelect" onchange="updateFigure('ts')">
                    <option value="">-- Select a timeseries --</option>
                </select>
	    </div>
        </div>
    </div>

    <!-- Main content -->
    <div id="main">
        <h1>SCM Case Comparison Viewer</h1>
        <img id="figureDisplay" src="" alt="Select a figure to display">
    </div>

    <!-- JavaScript -->
    <script>

    let CONFIG = {};
    let CURRENT_CASE = null;
    fetch("config.json")
      .then(res => res.json())
      .then(cfg => {
        CONFIG = cfg;
        populateCases();
      })
      .catch(err => console.error("Failed to load config:", err));

        function populateCases() {
            const caseSelect = document.getElementById("caseSelect");

            for (const [caseKey, caseObj] of Object.entries(CONFIG.cases)) {
                const opt = document.createElement("option");
                opt.value = caseKey;
                opt.textContent = caseObj.label;
                caseSelect.appendChild(opt);
            }
        }

        function selectCase() {
            const caseValue = document.getElementById("caseSelect").value;
            CURRENT_CASE = caseValue;

            const allSections = document.getElementsByClassName("config-section");
            for (let sec of allSections) {
                sec.style.display = "none";
            }

            if (!caseValue) return;

            document.getElementById("configSection").style.display = "block";

	    populateSuites(caseValue);
            populateFigures(caseValue);

            clearFigure();
        }

	function populateSuites(caseKey) {
            const suiteSelect = document.getElementById("suiteSelect");
            suiteSelect.innerHTML = `<option value="">-- Select a suite --</option>`;

            const suites = CONFIG.cases[caseKey].suites;
            for (const [cfgKey, cfgObj] of Object.entries(suites)) {
                const opt = document.createElement("option");
                opt.value = cfgKey;
                opt.textContent = cfgObj.label;
                suiteSelect.appendChild(opt);
            }
        }

	function populateAreas(caseKey) {
            const areaSelect = document.getElementById("areaSelect");
            areaSelect.innerHTML = `<option value="">-- Select column area --</option>`;

            const areas = CONFIG.cases[caseKey].areas;
            for (const [cfgKey, cfgObj] of Object.entries(areas)) {
                const opt = document.createElement("option");
                opt.value = cfgKey;
                opt.textContent = cfgObj.label;
                areaSelect.appendChild(opt);
            }
        }

	function populateDts(caseKey) {
            const dtSelect = document.getElementById("dtSelect");
            dtSelect.innerHTML = `<option value="">-- Select time step --</option>`;

            const dts = CONFIG.cases[caseKey].dts;
            for (const [cfgKey, cfgObj] of Object.entries(dts)) {
                const opt = document.createElement("option");
                opt.value = cfgKey;
                opt.textContent = cfgObj.label;
                dtSelect.appendChild(opt);
            }
        }

	function populateDtis(caseKey) {
            const dtiSelect = document.getElementById("dtiSelect");
            dtiSelect.innerHTML = `<option value="">-- Select physics time step --</option>`;

            const dtis = CONFIG.cases[caseKey].dtis;
            for (const [cfgKey, cfgObj] of Object.entries(dtis)) {
                const opt = document.createElement("option");
                opt.value = cfgKey;
                opt.textContent = cfgObj.label;
                dtiSelect.appendChild(opt);
            }
        }

        function buildDatasetDir() {

            const caseName = document.getElementById("caseSelect").value;
            const suite = document.getElementById("suiteSelect").value;
            const area = document.getElementById("areaSelect").value;
            const dt = document.getElementById("dtSelect").value;
            const dti = document.getElementById("dtiSelect").value;

            if (!caseName || !suite || !area || !dt || !dti) {
                return null;
            }

            // Special case for comparison
            if (suite === "comp") {
                return "comp";
            }

            return `${caseName}_${suite}_area${area}km_dt${dt}s_dti${dti}s`;
        }

	function populateFigures(caseKey) {
            const figs = CONFIG.cases[caseKey].figures;

            populateFigureSelect("meanSelect", figs.mean);
            populateFigureSelect("biasSelect", figs.bias);
            populateFigureSelect("tsSelect", figs.ts);
        }

        function populateFigureSelect(selectId, figGroup) {
            const sel = document.getElementById(selectId);
            sel.innerHTML = `<option value="">-- Select --</option>`;

            for (const [file, label] of Object.entries(figGroup.files)) {
                const opt = document.createElement("option");
                opt.value = file;
                opt.textContent = label;
                sel.appendChild(opt);
            }
        }

        function updateFigure(type) {
        const BASE_PLOT_DIR = CONFIG.base_plot_dir;
            let selectedPath = "";
            const meanSel = document.getElementById("meanSelect");
            const biasSel = document.getElementById("biasSelect");
            const tsSel = document.getElementById("tsSelect");

            if (type === "mean") {
                selectedPath = meanSel.value;
                biasSel.selectedIndex = 0;
                tsSel.selectedIndex = 0;
            } else if (type === "bias") {
                selectedPath = biasSel.value;
                meanSel.selectedIndex = 0;
                tsSel.selectedIndex = 0;
            } else if (type === "ts") {
                selectedPath = tsSel.value;
                meanSel.selectedIndex = 0;
                biasSel.selectedIndex = 0;
            }

            const datasetDir = buildDatasetDir();
            if (!datasetDir || !selectedPath) return;

            const imgTag = document.getElementById("figureDisplay");

            const imgPath = `${BASE_PLOT_DIR}/${datasetDir}/active/${selectedPath}`;

            imgTag.onerror = function () {
            imgTag.src = "";
            console.warn("Plot not available for this configuration.");
            };

            imgTag.src = imgPath;
        }

	function clearFigure() {
            document.getElementById("figureDisplay").src = "";
        }
    </script>

</body>
</html>
